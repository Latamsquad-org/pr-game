    # --- Endurecimiento fase B: paths sensibles ---
    # Dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Configs PHP fuera de la UI publica
    location = /pr/logs/config.php {
        deny all;
        return 404;
    }
    location = /pr/tracker/config.php {
        deny all;
        return 404;
    }

    # Backups / secretos tipicos en webroot
    # (bans1.sqlite3 sigue accesible: location = exacta con auth_request tiene prioridad)
    location ~* \.(bak|old|sql|env)$ {
        deny all;
        return 404;
    }

    # SEO: servir estaticos exactos (no caer en index.php via try_files)
    location = /robots.txt {
        root html;
        default_type text/plain;
        access_log off;
    }

    location = /sitemap.xml {
        root html;
        default_type application/xml;
        access_log off;
    }

    # Favicon: evitar que /favicon.ico y /pr/tracker/favicon.ico caigan en PHP
    location = /favicon.ico {
        alias C:/nginx/html/assets/img/favicon.png;
        default_type image/png;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        include latam-security-headers.conf;
    }
    location = /pr/tracker/favicon.ico {
        alias C:/nginx/html/assets/img/favicon.png;
        default_type image/png;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        include latam-security-headers.conf;
    }

    location / {
        index index.php index.html;
        try_files $uri $uri/ /index.php?$args;
    }

    location = /index.php {
        include latam-security-rate-php.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME C:/nginx/html/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Hub LATAMFILES: pagina intermedia Project Reality (archivos/tracker)
    location = /pr.php {
        include latam-security-rate-php.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME C:/nginx/html/pr.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
    }

