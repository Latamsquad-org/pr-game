    # URL antigua BF2demos-3D -> demos3d (301 permanente)
    location ~* ^/pr/BF2demos-3D/(?<bf2rest>.*)$ {
        return 301 /pr/demos3d/$bf2rest;
    }

    location ^~ /admin/data/ {
        deny all;
        return 404;
    }

    # Panel admin LATAMFILES (solo staff; gate en PHP)
    location = /admin {
        return 301 /admin/;
    }
    location = /admin/ {
        include latam-security-rate-admin.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME C:/nginx/html/admin/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
    }
    location ~ ^/admin/(.+\.php)$ {
        include latam-security-rate-admin.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME C:/nginx/html/admin/$1;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
    }

    location = /auth/gate.php {
        internal;
        include latam-security-rate-auth.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME C:/nginx/html/auth/gate.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ ^/auth/(.+\.php)$ {
        include latam-security-rate-auth.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME C:/nginx/html/auth/$1;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
    }

    location @go_discord_login {
        return 302 /auth/discord.php;
    }

    location /pr/admins/logs/sv1/ {
        auth_request /auth/gate.php;
        error_page 401 = @go_discord_login;
