    # PR LOG Viewer (public UI; cache dir not web-readable)
    location ^~ /pr/logs/public/logs/ {
        deny all;
        return 404;
    }

    location = /pr/logs {
        return 301 /pr/logs/;
    }

    location /pr/logs/ {
        root html;
        index index.html index.php;
        try_files $uri $uri/ /pr/logs/index.html;
    }

    location ~ ^/pr/logs/(.+\.php)$ {
        root html;
        include latam-security-rate-php.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/pr/logs/$1;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Tracker en /pr/tracker (archivos en html/pr/tracker/)
    location /pr/tracker/ {
        root html;
        index index.php;
        try_files $uri $uri/ /pr/tracker/index.php?$args;
    }

    location ~ ^/pr/tracker/(.+\.php)$ {
        root html;
        include latam-security-rate-php.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/pr/tracker/$1;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Redirect legacy /tracker -> /pr/tracker
    location = /tracker {
        return 301 /pr/tracker/;
    }
    location /tracker/ {
        rewrite ^/tracker/(.*)$ /pr/tracker/$1 permanent;
    }
